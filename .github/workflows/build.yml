name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar app del TV
        run: gradle :tv:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: cp tv/build/outputs/apk/debug/tv-debug.apk gesto-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gesto-tv-apk
          path: gesto-tv.apk

      - name: Publicar versión (link fijo para el TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Gesto TV 0.1.${{ github.run_number }}
          files: gesto-tv.apk
          make_latest: "true"
